name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Siapkan proyek
        run: |
          mkdir -p www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/geolocation@8
          echo '{"appId":"id.nusaga.app","appName":"Nusaga","webDir":"www","plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Bangun APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rilis APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk --title "Nusaga build ${{ github.run_number }}" --notes "APK debug Nusaga" --latest
